<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Anger控制面板 · 过检测器</title>
    <style>
        /* ----- 极简线条风格 · 黑灰氛围 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0C0F;
            font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 20px;
            background-image: radial-gradient(circle at 15% 40%, rgba(255,255,255,0.008) 1px, transparent 1px);
            background-size: 26px 26px;
        }

        .container {
            background: #0F1117;
            border-radius: 42px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 0 0 1px rgba(0,0,0,0.45);
            padding: 32px 28px 36px;
            max-width: 620px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        h1 {
            color: #F1F3F7;
            font-size: 26px;
            font-weight: 510;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1::before {
            content: "◍";
            font-size: 24px;
            font-weight: 400;
            color: #7B8AE0;
            opacity: 0.75;
        }
        
        .help-btn {
            background: rgba(123, 138, 224, 0.07);
            backdrop-filter: blur(8px);
            border: 0.8px solid rgba(123, 138, 224, 0.35);
            border-radius: 100px;
            padding: 5px 18px;
            font-size: 12px;
            font-weight: 500;
            color: #C9D0FF;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .help-btn::before {
            content: "📘";
            font-size: 12px;
        }
        .help-btn:hover {
            background: rgba(123, 138, 224, 0.18);
            border-color: rgba(123, 138, 224, 0.7);
            color: white;
            transform: translateY(-1px);
        }

        .subtitle {
            color: #8E94A5;
            margin-bottom: 28px;
            font-size: 12px;
            font-weight: 400;
            border-left: 2px solid #2A2F3A;
            padding-left: 12px;
        }

        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #C9CFDD;
            font-weight: 460;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        /* 双输入框 + 单logo 垂直布局 */
        .dual-input-group {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .inputs-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-field {
            width: 100%;
        }
        .logo-wrapper {
            width: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 94px;
        }
        .logo-image {
            width: 100%;
            max-width: 68px;
            border-radius: 16px;
            object-fit: contain;
            opacity: 0.65;
            transition: opacity 0.2s;
        }
        
        select, input {
            width: 100%;
            padding: 11px 14px;
            background: #090B10;
            border: 1px solid #2B2F3A;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 450;
            color: #EDF2F9;
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }
        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23868B9F' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
        }
        select:focus, input:focus {
            border-color: #6F7DDE;
            box-shadow: 0 0 0 1px rgba(98, 114, 210, 0.25);
        }
        
        .btn-toggle {
            width: 100%;
            padding: 13px 0;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 570;
            cursor: pointer;
            background: rgba(88, 101, 242, 0.12);
            border: 1px solid #5B6AD0;
            color: #C2CBFF;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            font-family: inherit;
            letter-spacing: 0.8px;
            margin-top: 8px;
        }
        .btn-toggle:hover {
            background: rgba(88, 101, 242, 0.22);
            border-color: #8897F0;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(88, 101, 242, 0.2);
        }
        .btn-toggle:active {
            transform: translateY(0px);
        }

        /* ----- 状态卡片区域 (重点: 时长胶囊 各占50%) ----- */
        .status-area {
            margin-top: 28px;
        }
        
        /* 第一行: 进程+连接 (全宽 胶囊) */
        .status-row {
            background: #0B0E14;
            border: 1px solid #576e9c;
            border-radius: 100px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 50%;
            margin: 0 auto;
            margin-bottom: 12px;
        }
        
        /* 第二行: 本次时长 + 累计时长 — 两个独立胶囊 各占50% 同一行 */
        .duration-duo {
            display: flex;
            gap: 12px;
            width: 100%;
            margin: 0 auto;
            
        }
        
        /* 单个时长胶囊，各占一半宽度 */
        .duration-capsule {
            flex: 1;
            background: #0B0E14;
            border: 1px solid #576e9c;
            border-radius: 100px;
            padding: 10px 12px;
            text-align: center;
            transition: all 0.15s ease;
        }
        
        /* 调小字体防止挤压 — 关键点 */
        .duration-label-sm {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 540;
            letter-spacing: 0.8px;
            color: #7B8296;
            margin-bottom: 4px;
        }
        
        .duration-value-sm {
            font-size: 10px;
            font-weight: 530;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #E0E6F0;
            line-height: 1.25;
            word-break: keep-all;
        }
        
        /* 第三行: 当前时间胶囊 (窄居中) */
        .time-capsule {
            background: rgba(11, 14, 20, 0.7);
            border: 1px solid #576e9c;
            border-radius: 100px;
            padding: 8px 16px;
            width: 70%;
            margin: 0 auto;
            text-align: center;
            margin-bottom: 12px;
        }
        .time-value {
            font-size: 11px;
            font-weight: 470;
            font-family: 'SF Mono', monospace;
            color: #8E94A5;
            letter-spacing: 0.4px;
        }
        
        .status-item-inline {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .status-label-inline {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 520;
            letter-spacing: 0.7px;
            color: #7B8296;
        }
        /* 符号样式 */
        .status-value {
            font-size: 0;
        }
        .status-value.running::before {
            content: "●";
            font-size: 15px;
            color: #6FCF97;
        }
        .status-value.stopped::before {
            content: "○";
            font-size: 15px;
            color: #E59999;
        }
        .status-value.connected-true::before {
            content: "✓";
            font-size: 15px;
            color: #6FCF97;
        }
        .status-value.connected-false::before {
            content: "✗";
            font-size: 15px;
            color: #E59999;
        }

        .message {
            margin-top: 20px;
            padding: 10px 16px;
            border-radius: 28px;
            font-size: 12px;
            display: none;
            background: rgba(16, 20, 28, 0.9);
            border: 1px solid #2E3240;
            color: #E2E8F2;
        }
        .message.show {
            display: block;
        }
        .message.success {
            background: rgba(46, 125, 50, 0.18);
            border-left: 3px solid #6FCF97;
            color: #C8F0DA;
        }
        .message.error {
            background: rgba(185, 28, 28, 0.16);
            border-left: 3px solid #F87171;
            color: #FFDEDE;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 16px 0 8px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 2px solid #262C3A;
            border-top: 2px solid #7C8BE0;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .persist-badge {
            text-align: center;
            font-size: 10px;
            color: #676E7E;
            margin-top: 26px;
            padding-top: 14px;
            border-top: 1px solid #242933;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .container { animation: fadeIn 0.3s ease; }
        
        /* 辅助隐藏 */
        .original-buttons { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="title-wrapper">
        <h1>🎮 Anger</h1>
        <div class="help-btn" id="helpBtn">说明</div>
    </div>
    <div class="subtitle">腾讯游戏过检测 · 稳定守护</div>

    <div class="form-group">
        <label>🎯 选择游戏</label>
        <select id="gameSelect">
            <option value="">加载游戏列表...</option>
        </select>
    </div>

    <div class="form-group">
        <label>👤 账户信息</label>
        <div class="dual-input-group">
            <div class="inputs-wrapper">
                <div class="input-field">
                    <input type="text" id="username" placeholder="用户名 / 账号" autocomplete="off">
                </div>
                <div class="input-field">
                    <input type="password" id="password" placeholder="密码" autocomplete="off">
                </div>
            </div>
            <div class="logo-wrapper">
                <img src="https://pan.anger.us.kg/raw/images.jpeg" alt="logo" class="logo-image" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <button class="btn-toggle" id="mainToggleBtn">▶ 启动代理</button>

    <!-- 状态卡片区域 : 符合本次需求和累计时长并排胶囊 -->
    <div class="status-area">
        <!-- 第一行 进程+连接 各占50%视觉宽度 (胶囊内联) -->
        <div class="status-row">
            <!--<div class="status-item-inline">
                <span class="status-label-inline">进程状态</span>
                <span class="status-value" id="procStatusIcon"></span>
            </div>-->
            <div class="status-item-inline">
                <span class="status-label-inline">连接状态</span>
                <span class="status-value" id="connStatusIcon"></span>
            </div>
        </div>

        

        <!-- 第三行: 当前时间胶囊 居中窄宽 -->
        <div class="time-capsule">
            <div class="time-value" id="currentTimeText">— : — : —</div>
        </div>

        <!-- 第二行: 本次时长 + 累计时长 —— 两个独立胶囊，各占一半宽度，字体调小防止挤压 -->
        <div class="duration-duo">
            <div class="duration-capsule">
                <div class="duration-label-sm">本次时长</div>
                <div class="duration-value-sm" id="sessionDurationDisplay">0 秒</div>
            </div>
            <div class="duration-capsule">
                <div class="duration-label-sm">累计时长</div>
                <div class="duration-value-sm" id="totalDurationDisplay">0 秒</div>
            </div>
        </div>
    </div>

    <div class="loading" id="loadingSpinner"><div class="spinner"></div></div>
    <div class="message" id="globalMsg"></div>
    <div class="persist-badge">
        <span>⚡ Anger 过检测引擎 · 运行中</span>
    </div>
</div>

<script>
    // ----------------------------- 全局变量 -----------------------------
    let gamesList = [];
    let proxyActive = false;        // 代理进程是否运行中 (启动/停止状态)
    let isConnected = false;        // 后端连接状态 (模拟)
    let sessionSeconds = 0;          // 本次运行秒数
    let totalSeconds = 0;            // 累计秒数 (从后端或本地存储读取)
    let sessionTimer = null;          // 前端本次计时器
    
    // 模拟存储累计时长 (实际应从后端获取，但此处演示持久化localStorage)
    let storageTotalKey = 'anger_total_duration';
    
    // UI 元素
    const gameSelect = document.getElementById('gameSelect');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('mainToggleBtn');
    const procStatusIcon = document.getElementById('procStatusIcon');
    const connStatusIcon = document.getElementById('connStatusIcon');
    const sessionDurationSpan = document.getElementById('sessionDurationDisplay');
    const totalDurationSpan = document.getElementById('totalDurationDisplay');
    const currentTimeSpan = document.getElementById('currentTimeText');
    const loadingDiv = document.getElementById('loadingSpinner');
    const msgDiv = document.getElementById('globalMsg');
    
    // 帮助链接 (系统浏览器)
    const HELP_URL = "https://www.anger.us.kg/";
    
    // ----------------------------- 辅助函数 -----------------------------
    function showMessage(text, type = 'info', duration = 2800) {
        msgDiv.innerHTML = text;
        msgDiv.className = `message show ${type}`;
        setTimeout(() => {
            if (msgDiv.className.includes('show')) msgDiv.classList.remove('show');
        }, duration);
    }
    
    function setLoading(show) {
        if (show) loadingDiv.classList.add('show');
        else loadingDiv.classList.remove('show');
    }
    
    // 格式化秒数为 时:分:秒 或 秒数友好展示
    function formatDuration(seconds) {
        if (isNaN(seconds)) seconds = 0;
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        if (hrs > 0) return `${hrs}时 ${mins}分 ${secs}秒`;
        if (mins > 0) return `${mins}分 ${secs}秒`;
        return `${secs}秒`;
    }
    
    // 更新UI中的时长显示 (本次 + 累计)
    function updateDurationUI() {
        sessionDurationSpan.innerText = formatDuration(sessionSeconds);
        totalDurationSpan.innerText = formatDuration(totalSeconds);
        // 同时保存累计时长到本地存储（模拟持久化）
        try {
            localStorage.setItem(storageTotalKey, totalSeconds.toString());
        } catch(e) {}
    }
    
    // 更新代理状态图标 (进程状态符号)
    function updateProxyStatusUI() {
        if (proxyActive) {
            procStatusIcon.className = "status-value running";
        } else {
            procStatusIcon.className = "status-value stopped";
        }
        // 按钮文字切换
        if (proxyActive) {
            toggleBtn.innerHTML = "⏹ 停止代理";
            toggleBtn.style.background = "rgba(239, 68, 68, 0.1)";
            toggleBtn.style.borderColor = "#DC2626";
            toggleBtn.style.color = "#FECACA";
        } else {
            toggleBtn.innerHTML = "▶ 启动代理";
            toggleBtn.style.background = "rgba(88, 101, 242, 0.12)";
            toggleBtn.style.borderColor = "#5B6AD0";
            toggleBtn.style.color = "#C2CBFF";
        }
    }
    
    // 连接状态UI
    function updateConnStatusUI() {
        if (isConnected) {
            connStatusIcon.className = "status-value connected-true";
        } else {
            connStatusIcon.className = "status-value connected-false";
        }
    }
    
    // 本次计时器管理 (基于前端模拟)
    function startLocalSessionTimer() {
        if (sessionTimer) clearInterval(sessionTimer);
        sessionTimer = setInterval(() => {
            if (proxyActive && isConnected) {
                // 只有代理运行并且连接成功时，本次时长才递增
                sessionSeconds++;
                totalSeconds++;
                // 更新累计时长到本地存储
                localStorage.setItem(storageTotalKey, totalSeconds);
                updateDurationUI();
            } else if (!proxyActive) {
                // 代理停止时本次时长不再增加，但累计不变
                // 不做额外动作
            }
        }, 1000);
    }
    
    // 停止前端计时 (但不清除session值，重置时需要重置)
    function stopLocalSessionTimer() {
        if (sessionTimer) {
            clearInterval(sessionTimer);
            sessionTimer = null;
        }
    }
    
    // 重置本次时长 (当代理重新启动时调用，累计不清零)
    function resetSessionDuration() {
        sessionSeconds = 0;
        updateDurationUI();
    }
    
    // 模拟后端/本地的累计时长初始化 (从localStorage读取)
    function loadTotalDurationFromStorage() {
        let stored = localStorage.getItem(storageTotalKey);
        if (stored !== null && !isNaN(parseInt(stored))) {
            totalSeconds = parseInt(stored);
        } else {
            totalSeconds = 0;
        }
        updateDurationUI();
    }
    
    // 模拟连接状态检测 (实际上根据后端接口，这里用随机模拟 + 依赖代理状态)
    // 为了演示过检测器面板，我们建立一个心跳检测：如果代理开启，连接状态大概率为true，模拟后端响应
    let heartbeatInterval = null;
    function startHeartbeatCheck() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        heartbeatInterval = setInterval(() => {
            if (proxyActive) {
                // 模拟后端连接检测 (真实场景调用接口 /status)
                // 这里模拟成功率95%表示连接正常，过检测器展示连接正常
                // 但为了真实感，我们根据一个变量维护假连接，实际可根据 /api/check 模拟
                // 如果代理正在运行，我们认为连接成功后端可通 (假设通过ksu或api)
                // 为了演示更加真实，随机偶尔断开一下但很快恢复（体现网络波动）
                let random = Math.random();
                if (random < 0.92) {
                    if (!isConnected) isConnected = true;
                } else {
                    if (isConnected) isConnected = false;
                }
            } else {
                // 代理停止则连接状态必然false
                isConnected = false;
            }
            updateConnStatusUI();
            
            // 额外：如果代理停止且连接为false，但若曾经计时器: 本次时长自然暂停，符合逻辑
            if (!proxyActive && sessionSeconds > 0) {
                // 不再递增时长，保持session展示
            }
        }, 2200);
    }
    
    // ----- 模拟获取游戏列表 (API) -----
    async function fetchGames() {
        try {
            setLoading(true);
            // 模拟请求 （实际应调用后端接口 /api/games）
            await new Promise(resolve => setTimeout(resolve, 400));
            // 模拟游戏数据
            gamesList = [
                { id: "pubg", name: "和平精英" },
                { id: "cf", name: "穿越火线" },
                { id: "lol", name: "英雄联盟手游" },
                { id: "王者荣耀", name: "王者荣耀" },
                { id: "cod", name: "使命召唤手游" }
            ];
            gameSelect.innerHTML = '<option value="">请选择游戏</option>';
            gamesList.forEach(game => {
                const option = document.createElement('option');
                option.value = game.id;
                option.textContent = game.name;
                gameSelect.appendChild(option);
            });
            setLoading(false);
        } catch (err) {
            setLoading(false);
            showMessage('加载游戏列表失败，请重试', 'error');
            gameSelect.innerHTML = '<option value="">加载失败</option>';
        }
    }
    
    // 启动代理逻辑 (模拟调用ksu或后端)
    async function startProxy() {
        if (proxyActive) {
            showMessage('代理已在运行中', 'info', 1500);
            return;
        }
        const gameId = gameSelect.value;
        if (!gameId) {
            showMessage('请先选择游戏', 'error');
            return;
        }
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
            showMessage('请填写用户名和密码', 'error');
            return;
        }
        
        setLoading(true);
        // 模拟发起启动代理请求 (过检测器调用)
        await new Promise(resolve => setTimeout(resolve, 680));
        // 模拟后端API启动成功
        try {
            // 假设调用 ksu 或者后端接口 /api/start
            // 模拟成功情况 95%
            const success = Math.random() > 0.05;
            if (success) {
                proxyActive = true;
                isConnected = true;   // 启动后后端连通
                // 重置本次计时时长，累计保留
                resetSessionDuration();
                updateProxyStatusUI();
                updateConnStatusUI();
                // 重新开启计时器（如果计时器存在则先停后开保证计数器活跃）
                stopLocalSessionTimer();
                startLocalSessionTimer();
                showMessage(`✅ 过检测代理已启动 (${gamesList.find(g => g.id === gameId)?.name || gameId})`, 'success');
            } else {
                showMessage('启动失败: 服务端拒绝连接', 'error');
                proxyActive = false;
                isConnected = false;
                updateProxyStatusUI();
                updateConnStatusUI();
            }
        } catch (e) {
            showMessage('启动异常: ' + e.message, 'error');
        } finally {
            setLoading(false);
        }
    }
    
    // 停止代理逻辑
    async function stopProxy() {
        if (!proxyActive) {
            showMessage('代理未运行', 'info');
            return;
        }
        setLoading(true);
        await new Promise(resolve => setTimeout(resolve, 500));
        try {
            proxyActive = false;
            isConnected = false;
            updateProxyStatusUI();
            updateConnStatusUI();
            // 停止计时器，本次时长将不再增加，但保留显示最后的本次时长（业务逻辑一般停止后本次时长重置会等下次启动重置）
            // 注意: 停止时不重置累计，累计保留，本次时长不清零但下次启动会resetSessionDuration，这是符合预期的
            // 但为了体验，停止后sessionTimer依然存在但代理为false不会递增，不用额外操作
            showMessage('⏸ 代理已停止，过检测关闭', 'info');
        } catch (e) {
            showMessage('停止出错: ' + e.message, 'error');
        } finally {
            setLoading(false);
        }
    }
    
    // 按钮切换
    function onToggleClick() {
        if (proxyActive) {
            stopProxy();
        } else {
            startProxy();
        }
    }
    
    // 当前时间实时刷新
    function updateCurrentTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        currentTimeSpan.innerText = `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
    }
    
    // 打开帮助页面 (系统浏览器)
    function openHelpExternal() {
        // 尝试多环境打开
        if (typeof ksu !== 'undefined' && ksu.exec && typeof ksu.exec === 'function') {
            try {
                const cmd = `am start -a android.intent.action.VIEW -d '${HELP_URL}'`;
                ksu.exec(cmd, (errno, stdout, stderr) => {
                    if (errno === 0) showMessage('📖 帮助页面已打开', 'info', 1800);
                    else fallbackOpenUrl();
                });
                return;
            } catch(e) { fallbackOpenUrl(); }
        } else {
            fallbackOpenUrl();
        }
    }
    
    function fallbackOpenUrl() {
        try {
            window.open(HELP_URL, '_blank');
            showMessage('📖 正在打开说明页面', 'info', 1600);
        } catch(e) {
            const intentLink = `intent://${HELP_URL.replace(/^https?:\/\//, '')}#Intent;scheme=https;end;`;
            window.location.href = intentLink;
            showMessage('尝试使用浏览器打开', 'info');
        }
    }
    
    // 初始化计时显示、加载累计存储、启动心跳检测，时间刷新
    function init() {
        loadTotalDurationFromStorage();
        updateDurationUI();
        startLocalSessionTimer();      // 计时器启动但proxyActive false则不计时
        startHeartbeatCheck();
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);
        updateProxyStatusUI();
        updateConnStatusUI();
        fetchGames();
        
        // 绑定事件
        toggleBtn.addEventListener('click', onToggleClick);
        document.getElementById('helpBtn').addEventListener('click', openHelpExternal);
        
        // 如果之前有存储的累计时长，累计显示正常
        // 额外: 确保proxyActive初始false
        proxyActive = false;
        isConnected = false;
        updateProxyStatusUI();
        updateConnStatusUI();
        // 重置本次时长（初始为0）
        resetSessionDuration();
    }
    
    // 启动初始化
    init();
</script>
</body>
</html>
