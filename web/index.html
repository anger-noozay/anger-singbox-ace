<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Anger控制面板 · 胶囊时长</title>
    <style>
        /* ----- 重置 & 极致线条风格 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0C0F;
            font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
            background-image: radial-gradient(circle at 20% 35%, rgba(255,255,255,0.008) 1px, transparent 1px);
            background-size: 28px 28px;
            user-select: none;
        }

        .container {
            background: #0F1117;
            border-radius: 36px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 0 1px rgba(0,0,0,0.4);
            padding: 36px 32px 40px;
            max-width: 650px;
            width: 100%;
            transition: box-shadow 0.2s ease;
            animation: fadeIn 0.3s ease;
        }

        .title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        h1 {
            color: #F1F3F7;
            font-size: 26px;
            font-weight: 510;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        h1::before {
            content: "◍";
            font-size: 24px;
            font-weight: 400;
            color: #7B8AE0;
            opacity: 0.7;
        }
        
        .follow-btn {
            background: rgba(123, 138, 224, 0.08);
            backdrop-filter: blur(8px);
            border: 0.8px solid rgba(123, 138, 224, 0.35);
            border-radius: 100px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 500;
            color: #C9D0FF;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .follow-btn::before {
            content: "📘";
            font-size: 13px;
            opacity: 0.8;
        }
        .follow-btn:hover {
            background: rgba(123, 138, 224, 0.18);
            border-color: rgba(123, 138, 224, 0.7);
            color: #FFFFFF;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(88, 101, 242, 0.2);
        }
        .follow-btn:active {
            transform: translateY(0px);
        }
        
        .subtitle {
            color: #8E94A5;
            margin-bottom: 32px;
            font-size: 13px;
            font-weight: 400;
            border-left: 2px solid #2A2F3A;
            padding-left: 12px;
            letter-spacing: 0.2px;
        }

        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #C9CFDD;
            font-weight: 460;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        
        /* 双输入框 + 单logo垂直布局 (不变) */
        .dual-input-group {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        
        .inputs-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .input-field {
            width: 100%;
        }
        
        .logo-wrapper {
            width: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 104px;
        }
        
        .logo-image {
            width: 100%;
            height: auto;
            max-width: 100px;
            border-radius: 16px;
            object-fit: contain;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }
        
        .logo-image:hover {
            opacity: 0.9;
        }
        
        select, input {
            width: 100%;
            padding: 12px 14px;
            background: #090B10;
            border: 1px solid #5267a1;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 450;
            color: #EDF2F9;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            outline: none;
            font-family: inherit;
        }
        
        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23868B9F' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }
        select:hover, input:hover {
            border-color: #404654;
        }
        select:focus, input:focus {
            border-color: #535d9f;
            box-shadow: 0 0 0 1px rgba(98, 114, 210, 0.3);
        }
        input::placeholder {
            color: #4C515F;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 32px;
            margin-bottom: 24px;
            justify-content: center;
        }
        
        .btn-toggle {
            flex: 0 1 auto;
            min-width: 100%;
            padding: 12px 28px;
            border-radius: 44px;
            font-size: 15px;
            font-weight: 560;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            background: transparent;
            font-family: inherit;
            letter-spacing: 0.5px;
            border: 1px solid;
        }
        
        .btn-toggle.start-mode {
            background: rgba(8, 31, 95, 0.301);
            border-color: #a495e5d2;
            color: #C2CBFF;
        }
        .btn-toggle.start-mode:hover {
            background: rgba(88, 232, 242, 0.16);
            border-color: #f0a788;
            color: #E4E9FF;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(242, 188, 88, 0.25);
        }
        
        .btn-toggle.stop-mode {
            background: rgba(239, 68, 68, 0.08);
            border-color: #db4a4a;
            color: #FECACA;
        }
        .btn-toggle.stop-mode:hover {
            background: rgba(239, 68, 68, 0.16);
            border-color: #F87171;
            color: #FFE3E3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.2);
        }
        
        .btn-toggle:active {
            transform: translateY(0px);
        }
        
        .original-buttons {
            display: none;
        }

        /* ★ 品字形布局 — 已移除进程状态，只保留连接状态 ★ */
        .status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }
        
        /* 第一行：只保留连接状态，单独居中胶囊 */
        .status-row {
            background: #0B0E14;
            border: 1px solid #4b6da0;
            border-radius: 999px;
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60%;
            margin: 0 auto;
        }
        
        /* 第二行：本次时长 + 累计时长 — 两个独立胶囊，各占50% 同行 */
        .duration-capsules-row {
            display: flex;
            gap: 12px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* 单个胶囊样式 */
        .duration-capsule {
            flex: 1;
            background: #0B0E14;
            border: 1px solid #424f87b9;
            border-radius: 999px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(2px);
        }
        
        .duration-capsule:hover {
            border-color: #3E4357;
            background: #C2CBFF10;
        }
        
        .duration-label-capsule {
            font-size: 10px;
            font-weight: 520;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #8E96AD;
            margin-bottom: 6px;
            text-align: center;
        }
        
        .duration-value-capsule {
            font-size: 12px;
            font-weight: 560;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            color: #E6EDFF;
            text-align: center;
            line-height: 1.3;
            word-break: keep-all;
            white-space: nowrap;
            overflow-x: auto;
            max-width: 100%;
        }
        
        @media (max-width: 460px) {
            .duration-value-capsule {
                font-size: 10px;
                white-space: nowrap;
            }
            .duration-label-capsule {
                font-size: 9px;
            }
            .duration-capsules-row {
                gap: 10px;
            }
        }
        
        /* 第三行：当前时间胶囊 */
        .time-card {
            background: rgba(11, 14, 20, 0.7);
            border: 1px solid rgba(69, 69, 123, 0.795);
            border-radius: 999px;
            padding: 10px 20px;
            text-align: center;
            width: 70%;
            margin: 0 auto;
        }
        
        .time-value {
            font-size: 10px;
            font-weight: 470;
            font-family: 'SF Mono', monospace;
            color: #b4c3e0;
            letter-spacing: 0.4px;
        }
        
        /* 连接状态样式 - 居中显示 */
        .status-item-inline {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        
        .status-label-inline {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 520;
            letter-spacing: 0.7px;
            color: #7B8296;
        }
        
        .status-value {
            font-size: 12px;
            font-weight: 530;
        }
        
        .status-value.connected-true::before {
            content: "✓";
            font-size: 12px;
            color: #6FCF97;
        }
        .status-value.connected-true {
            font-size: 0;
        }
        .status-value.connected-false::before {
            content: "✗";
            font-size: 12px;
            color: #E59999;
        }
        .status-value.connected-false {
            font-size: 0;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 26px;
            font-size: 13px;
            display: none;
            backdrop-filter: blur(6px);
            background: rgba(16, 20, 28, 0.85);
            border: 1px solid #2E3240;
            color: #E2E8F2;
            white-space: pre-line;
        }
        .message.show {
            display: block;
            animation: fadeSlideMsg 0.2s ease;
        }
        .message.success {
            background: rgba(46, 125, 50, 0.16);
            border-left: 3px solid #6FCF97;
            color: #D5F0E0;
        }
        .message.error {
            background: rgba(185, 28, 28, 0.14);
            border-left: 3px solid #F87171;
            color: #FFDCDC;
        }
        .message.info {
            background: rgba(56, 121, 165, 0.14);
            border-left: 3px solid #60A5FA;
            color: #D3E9FF;
        }
        @keyframes fadeSlideMsg {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 24px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 2px solid #262C3A;
            border-top: 2px solid #1b2076;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .persist-badge {
            text-align: center;
            font-size: 11px;
            color: #676E7E;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #242933;
            letter-spacing: 0.2px;
        }
        .persist-badge span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px);}
            to { opacity: 1; transform: translateY(0);}
        }
        
        #username, #password {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-wrapper">
            <h1>🎮Anger</h1>
            <div class="follow-btn" id="helpBtn">说明</div>
        </div>
        <div class="subtitle">腾讯游戏过检测器</div>

        <div class="form-group">
            <label>🎯 选择游戏</label>
            <select id="game">
                <option value="">加载中...</option>
            </select>
        </div>

        <!-- 双输入框 + 右侧单logo -->
        <div class="form-group">
            <label>👤 账户信息</label>
            <div class="dual-input-group">
                <div class="inputs-wrapper">
                    <div class="input-field">
                        <input type="text" id="username" placeholder="输入用户名" autocomplete="off">
                    </div>
                    <div class="input-field">
                        <input type="password" id="password" placeholder="输入密码" autocomplete="off">
                    </div>
                </div>
                <div class="logo-wrapper">
                    <img src="https://pan.anger.us.kg/raw/images.jpeg" alt="logo" class="logo-image" id="expiryLogo" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-toggle start-mode" id="toggleButton">▶ 启动代理</button>
        </div>

        <!-- 品字形状态布局 - 只保留连接状态 -->
        <div class="status-container">
            <!-- 第一行：仅连接状态 -->
            <div class="status-row">
                <div class="status-item-inline">
                    <span class="status-label-inline">连接状态</span>
                    <span class="status-value" id="connected"></span>
                </div>
            </div>


            <!-- 第三行：当前时间胶囊 -->
            <div class="time-card">
                <div class="time-value" id="nowTime">—</div>
            </div>
            <!-- 第二行：本次时长 + 累计时长 — 两个独立胶囊 -->
            <div class="duration-capsules-row">
                <div class="duration-capsule">
                    <div class="duration-label-capsule">本次时长</div>
                    <div class="duration-value-capsule" id="sessionDuration">0 秒</div>
                </div>
                <div class="duration-capsule">
                    <div class="duration-label-capsule">累计时长</div>
                    <div class="duration-value-capsule" id="totalDuration">0 秒</div>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="message" id="message"></div>
        
        <div class="persist-badge">
            <span>欢迎使用Anger过检测</span>
        </div>
    </div>

    <script>
        // ========== 打开系统浏览器的函数 ==========
        const HELP_URL = "https://www.anger.us.kg/";
        
        function openInSystemBrowser(url) {
            console.log('尝试打开链接:', url);
            if (typeof ksu !== 'undefined' && ksu.exec && typeof ksu.exec === 'function') {
                try {
                    const cmd = `am start -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d '${url}'`;
                    ksu.exec(cmd, (errno, stdout, stderr) => {
                        if (errno === 0) {
                            showMessage('📖 已打开帮助页面', 'info', 2000);
                        } else {
                            fallbackOpen(url);
                        }
                    });
                    return;
                } catch (e) {
                    fallbackOpen(url);
                }
                return;
            }
            fallbackOpen(url);
        }
        
        function fallbackOpen(url) {
            try {
                const newWindow = window.open(url, '_blank');
                if (newWindow && !newWindow.closed) {
                    showMessage('📖 正在打开帮助页面', 'info', 2000);
                } else {
                    const intentUrl = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;end;`;
                    window.location.href = intentUrl;
                    showMessage('📖 正在打开帮助页面', 'info', 2000);
                }
            } catch (e) {
                showMessage('❌ 无法打开页面: ' + e.message, 'error', 3000);
            }
        }
        
        function openHelp() {
            openInSystemBrowser(HELP_URL);
        }
        
        // ========== 核心变量 ==========
        let statusCheckInterval = null;
        let connectionCheckInterval = null;
        let saveTimeout = null;
        let gamesData = {};
        let localSessionTimer = null;
        let localSessionSeconds = 0;
        let currentProxyStatus = 'stopped';
        let currentConnectedStatus = false;
        let totalDurationSeconds = 0;
        
        const gameSelect = document.getElementById('game');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const connectedElement = document.getElementById('connected');
        const sessionDurationElement = document.getElementById('sessionDuration');
        const totalDurationElement = document.getElementById('totalDuration');
        const nowTimeElement = document.getElementById('nowTime');
        const loadingDiv = document.getElementById('loading');
        const messageDiv = document.getElementById('message');
        const helpBtn = document.getElementById('helpBtn');
        
        // ========== 新增: 到期查询相关 (使用 showMessage 展示) ==========
        let isQueryingExpiry = false;

        function showExpiryMessage(username, expireTime, remainingDays, isPermanent, isExpired) {
            let line1 = `👤 用户：${username}`;
            let line2 = '';
            let line3 = '';
            
            if (isPermanent) {
                line2 = `✨ 账号类型：永久用户 ✨`;
                line3 = `🎉 无过期限制，畅享服务`;
                showMessage(`${line1}\n${line2}\n${line3}`, 'success', 5000);
            } else if (isExpired) {
                line2 = `⛔ 账号状态：已过期 ⛔`;
                line3 = `📅 到期时间：${expireTime}`;
                showMessage(`${line1}\n${line2}\n${line3}`, 'error', 5000);
            } else {
                line2 = `⏰ 到期时间：${expireTime}`;
                let remainingText = (remainingDays !== null) ? `📆 剩余天数：${remainingDays} 天` : `📆 剩余天数：无法计算`;
                line3 = remainingText;
                let msgType = (remainingDays !== null && remainingDays <= 7 && remainingDays > 0) ? 'error' : 'info';
                showMessage(`${line1}\n${line2}\n${line3}`, msgType, 5000);
            }
        }

        async function queryUserExpiry(username) {
            if (!username || username.trim() === '') {
                showMessage('❌ 用户名为空，请先输入用户名', 'error', 3000);
                return;
            }
            if (isQueryingExpiry) {
                showMessage('⏳ 查询中，请稍后再试', 'info', 2000);
                return;
            }
            isQueryingExpiry = true;
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.classList.add('show');
            try {
                const encodedUsername = encodeURIComponent(username);
                const url = `http://111.229.140.194:5000/api/user/expiry?username=${encodedUsername}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(url, {
                    method: 'GET',
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                if (result && result.code === 1 && result.data) {
                    const data = result.data;
                    const isPermanent = data.is_permanent === true;
                    const isExpired = data.is_expired === true;
                    const expireTime = data.expire_time || '未知';
                    const remainingDays = data.remaining_days !== undefined ? data.remaining_days : null;
                    const userNameDisplay = data.username || username;
                    showExpiryMessage(userNameDisplay, expireTime, remainingDays, isPermanent, isExpired);
                } else {
                    const msg = result?.msg || '查询失败，未知错误';
                    showMessage(`❌ 查询到期失败\n服务返回：${msg}`, 'error', 4000);
                }
            } catch (error) {
                console.error('查询到期时间失败:', error);
                let errMsg = '网络请求失败';
                if (error.name === 'AbortError') errMsg = '请求超时，请检查网络';
                else if (error.message) errMsg = error.message;
                showMessage(`⚠️ 到期查询失败\n${errMsg}`, 'error', 4000);
            } finally {
                isQueryingExpiry = false;
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.classList.remove('show');
            }
        }
        
        function bindExpiryQueryEvent() {
            const logoImg = document.getElementById('expiryLogo');
            if (logoImg) {
                logoImg.removeEventListener('click', expiryClickHandler);
                logoImg.addEventListener('click', expiryClickHandler);
            } else {
                const fallbackLogo = document.querySelector('.logo-image');
                if (fallbackLogo && !fallbackLogo.id) fallbackLogo.id = 'expiryLogo';
                if (fallbackLogo) {
                    fallbackLogo.removeEventListener('click', expiryClickHandler);
                    fallbackLogo.addEventListener('click', expiryClickHandler);
                }
            }
        }
        
        function expiryClickHandler(e) {
            e.stopPropagation();
            const username = usernameInput ? usernameInput.value.trim() : '';
            if (!username) {
                showMessage('❌ 请先在「用户名」输入框中填写用户名', 'error', 3000);
                return;
            }
            queryUserExpiry(username);
        }
        
        // ---------- 原有功能（已移除进程状态相关）----------
        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds} 秒`;
            else if (seconds < 3600) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins} 分 ${secs} 秒`;
            } else {
                const hours = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                return `${hours} 小时 ${mins} 分`;
            }
        }
        
        function startLocalTimer() {
            if (localSessionTimer) clearInterval(localSessionTimer);
            localSessionTimer = setInterval(() => {
                if (currentProxyStatus === 'running') {
                    localSessionSeconds++;
                    sessionDurationElement.textContent = formatDuration(localSessionSeconds);
                }
            }, 1000);
        }
        
        function stopLocalTimer() {
            if (localSessionTimer) {
                clearInterval(localSessionTimer);
                localSessionTimer = null;
            }
            localSessionSeconds = 0;
            sessionDurationElement.textContent = formatDuration(0);
        }
        
        function resetLocalTimer(backendSessionSeconds) {
            localSessionSeconds = backendSessionSeconds;
            sessionDurationElement.textContent = formatDuration(localSessionSeconds);
            if (currentProxyStatus === 'running' && !localSessionTimer) {
                startLocalTimer();
            }
        }
        
        function updateCurrentTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            nowTimeElement.textContent = formatted;
        }
        
        function updateConnectedDisplay(connected) {
            currentConnectedStatus = connected;
            if (connected === true) {
                connectedElement.className = 'status-value connected-true';
                connectedElement.textContent = '';
            } else {
                connectedElement.className = 'status-value connected-false';
                connectedElement.textContent = '';
            }
        }
        
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const newStatus = data.status || 'stopped';
                const oldStatus = currentProxyStatus;
                currentProxyStatus = newStatus;
                
                if (data.total_duration !== undefined) {
                    totalDurationSeconds = data.total_duration;
                    totalDurationElement.textContent = formatDuration(totalDurationSeconds);
                }
                
                if (data.connected !== undefined) updateConnectedDisplay(data.connected);
                
                if (oldStatus === 'stopped' && newStatus === 'running') {
                    resetLocalTimer(data.session_duration || 0);
                } else if (oldStatus === 'running' && newStatus === 'stopped') {
                    stopLocalTimer();
                    updateConnectedDisplay(false);
                } else if (newStatus === 'running' && localSessionSeconds === 0) {
                    resetLocalTimer(data.session_duration || 0);
                }
                updateToggleButtonUI();
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }
        
        async function fetchConnectionStatus() {
            if (currentProxyStatus !== 'running') {
                updateConnectedDisplay(false);
                return;
            }
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                if (data.connected !== undefined) updateConnectedDisplay(data.connected);
            } catch (error) {
                console.error('连接检测失败:', error);
                updateConnectedDisplay(false);
            }
        }
        
        function updateToggleButtonUI() {
            const toggleBtn = document.getElementById('toggleButton');
            if (!toggleBtn) return;
            if (currentProxyStatus === 'running') {
                toggleBtn.textContent = '⏹ 停止代理';
                toggleBtn.classList.remove('start-mode');
                toggleBtn.classList.add('stop-mode');
            } else {
                toggleBtn.textContent = '▶ 启动代理';
                toggleBtn.classList.remove('stop-mode');
                toggleBtn.classList.add('start-mode');
            }
        }
        
        async function loadGames() {
            try {
                const response = await fetch('/api/games');
                const data = await response.json();
                if (response.ok && data.games) {
                    gamesData = data.games;
                    populateGameSelect(gamesData);
                    showMessage(`✅ 已加载 ${data.total} 个游戏`, 'info', 1500);
                } else throw new Error('获取游戏列表失败');
            } catch (error) {
                gameSelect.innerHTML = '<option value="">加载失败，请刷新重试</option>';
                showMessage('❌ 加载游戏列表失败', 'error');
            }
        }
        
        function populateGameSelect(games) {
            gameSelect.innerHTML = '';
            if (Object.keys(games).length === 0) {
                gameSelect.innerHTML = '<option value="">暂无可用游戏</option>';
                return;
            }
            for (const [id, game] of Object.entries(games)) {
                const option = document.createElement('option');
                option.value = id;
                option.innerHTML = `${game.icon || '🎮'} ${game.name} <span class="game-platform">[${game.platform}]</span>`;
                gameSelect.appendChild(option);
            }
        }
        
        async function loadConfigFromServer() {
            try {
                const response = await fetch('/api/getConfig');
                const data = await response.json();
                if (data.hasConfig === 'true') {
                    if (data.game && gamesData[data.game]) gameSelect.value = data.game;
                    if (data.username) usernameInput.value = data.username;
                    if (data.password) passwordInput.value = data.password;
                    showMessage('📀 已加载上次保存的配置', 'info', 2000);
                } else if (gameSelect.options.length > 0 && !gameSelect.value) gameSelect.selectedIndex = 0;
            } catch (error) {}
        }
        
        async function saveConfigToServer(game, username, password) {
            if (!game || !gamesData[game]) return;
            try {
                await fetch('/api/saveConfig', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game, username, password })
                });
                const badgeSpan = document.querySelector('.persist-badge span');
                if (badgeSpan) {
                    const original = badgeSpan.innerHTML;
                    badgeSpan.innerHTML = '💾 已保存到文件系统';
                    badgeSpan.style.color = '#6FCF97';
                    setTimeout(() => { badgeSpan.innerHTML = original; badgeSpan.style.color = ''; }, 1500);
                }
            } catch (error) {}
        }
        
        function debounceSaveToServer(game, username, password) {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => saveConfigToServer(game, username, password), 1000);
        }
        
        function showMessage(text, type, duration = 3000) {
            messageDiv.textContent = text;
            messageDiv.className = `message show ${type}`;
            setTimeout(() => {
                if (messageDiv.classList.contains('show')) messageDiv.classList.remove('show');
            }, duration);
        }
        
        function setLoading(show) {
            if (show) loadingDiv.classList.add('show');
            else loadingDiv.classList.remove('show');
        }
        
        function toggleProxy() {
            if (currentProxyStatus === 'running') stopProxy();
            else startProxy();
        }
        
        async function startProxy() {
            const game = gameSelect.value;
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!game) { showMessage('请选择游戏', 'error'); return; }
            if (!username || !password) { showMessage('请填写用户名和密码', 'error'); return; }
            setLoading(true);
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game, username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(`✅ ${gamesData[game]?.name || game} 代理启动成功`, 'success');
                    await fetchStatus();
                    await saveConfigToServer(game, username, password);
                } else showMessage('❌ 启动失败: ' + (data.error || data.message), 'error');
            } catch (error) { showMessage('❌ 请求失败', 'error'); }
            finally { setLoading(false); }
        }
        
        async function stopProxy() {
            setLoading(true);
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    showMessage('⏹ 代理已停止', 'success');
                    await fetchStatus();
                } else showMessage('❌ 停止失败', 'error');
            } catch (error) { showMessage('❌ 请求失败', 'error'); }
            finally { setLoading(false); }
        }
        
        window.startProxy = startProxy;
        window.stopProxy = stopProxy;
        
        gameSelect.addEventListener('change', () => {
            if (gameSelect.value) saveConfigToServer(gameSelect.value, usernameInput.value, passwordInput.value);
        });
        usernameInput.addEventListener('input', () => { if (gameSelect.value) debounceSaveToServer(gameSelect.value, usernameInput.value, passwordInput.value); });
        passwordInput.addEventListener('input', () => { if (gameSelect.value) debounceSaveToServer(gameSelect.value, usernameInput.value, passwordInput.value); });
        usernameInput.addEventListener('blur', () => { if (saveTimeout) clearTimeout(saveTimeout); if (gameSelect.value) saveConfigToServer(gameSelect.value, usernameInput.value, passwordInput.value); });
        passwordInput.addEventListener('blur', () => { if (saveTimeout) clearTimeout(saveTimeout); if (gameSelect.value) saveConfigToServer(gameSelect.value, usernameInput.value, passwordInput.value); });
        
        async function init() {
            await loadGames();
            await loadConfigFromServer();
            await fetchStatus();
            const toggleBtn = document.getElementById('toggleButton');
            if (toggleBtn) toggleBtn.addEventListener('click', toggleProxy);
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            statusCheckInterval = setInterval(fetchStatus, 3000);
            connectionCheckInterval = setInterval(fetchConnectionStatus, 60000);
            bindExpiryQueryEvent();
        }
        init();
        
        window.addEventListener('beforeunload', () => {
            if (saveTimeout) clearTimeout(saveTimeout);
            if (localSessionTimer) clearInterval(localSessionTimer);
            if (statusCheckInterval) clearInterval(statusCheckInterval);
            if (connectionCheckInterval) clearInterval(connectionCheckInterval);
            if (gameSelect.value) saveConfigToServer(gameSelect.value, usernameInput.value, passwordInput.value);
        });
    </script>
</body>
</html>
